<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeWally" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f3fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0d2c" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>HomeWally</title>
    <!-- Cascade layer order. Module styles are loaded later (code splitting), so their position in the
         page must not decide the result: themes always win over module and app styles. -->
    <style>
      @layer app, modules, themes;
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
